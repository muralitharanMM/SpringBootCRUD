spring.application.name=moviecatalogsystem
server.port=8083
# Enable resilience4j circuit breaker
resilience4j.circuitbreaker.instances.movieRatingService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.movieRatingService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.movieRatingService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.movieRatingService.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.movieRatingService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.movieRatingService.minimumNumberOfCalls=5